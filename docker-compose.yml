services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ibis
      POSTGRES_USER: ibis_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibis_user"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ibis.com
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  etl:
    build: .
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_password
    # Fernet decryption keys are injected as environment variables rather
    # than mounted from secrets/ alongside the ciphertext they decrypt — see
    # README.md#secrets. Populate these in a .env file (gitignored) or the
    # host/orchestrator's own secret store; docker compose reads .env
    # automatically. Any that are unset fall back to the matching *_key file
    # in secrets/ for local development only.
    environment:
      IBIS_FTP_FERNET_KEY: ${IBIS_FTP_FERNET_KEY:-}
      IBIS_SEVENZ_FERNET_KEY: ${IBIS_SEVENZ_FERNET_KEY:-}
      IBIS_BLASTA_FERNET_KEY: ${IBIS_BLASTA_FERNET_KEY:-}
      IBIS_SMTP_FERNET_KEY: ${IBIS_SMTP_FERNET_KEY:-}
    volumes:
      - .:/app
      - ./config.json:/app/config.json:ro
      - ./secrets:/app/secrets:ro
      - ./Downloads:/app/Downloads
      - ./Extracted:/app/Extracted
      - ./logs:/var/log/ibis
      - ./backups:/app/backups
    command: ["cron", "-f"]
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "pgrep cron || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  pgdata:
